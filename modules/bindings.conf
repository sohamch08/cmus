# vim: set filetype=cmus :

# Pause: c -> space; next/previous: b/z -> Ctrl+N/Ctrl+P; stop: v -> X
unbind -f common c
unbind -f common b
unbind -f common z
unbind -f common v

# Clear old volume shortcuts before assigning u/d and +/- below
unbind -f common +
unbind -f common =
unbind -f common -
unbind -f common [
unbind -f common ]
unbind -f common {
unbind -f common }

# Search: / -> f; reset n/N for next/previous match
unbind -f common /
unbind -f common n
unbind -f common N

# Repeat current: Ctrl+R -> R; follow: f -> F
unbind -f common ^R
unbind -f common f

# F previously opened the filter prompt; it now toggles follow.
unbind -f common F

# Mark/expand: space -> W; remove V and the old p/P reordering shortcuts
unbind -f common space
unbind -f common V
unbind -f common p
unbind -f common P

# Clear J/K and replace Tab's old pane-switch binding before view cycling
unbind -f common J
unbind -f common K
unbind -f common tab
unbind -f common back_tab

# Refresh metadata: u -> U; replace U's old selected-track update.
unbind -f common u
unbind -f common U

# Playback
bind -f common space player-pause
bind -f common enter win-activate
bind -f common ^N player-next
bind -f common ^P player-prev
bind -f common X player-stop
# bind -f common q quit
bind -f common q shell tmux detach-client -s cmus

# Volume
bind -f common u vol +5%
bind -f common d vol -5%
bind -f common + vol +5%
bind -f common - vol -5%
bind -f common m mute

# Navigation and seeking
bind -f common j win-down
bind -f common k win-up
bind -f common h seek -5
bind -f common l seek +5

# Switch between the artist/album pane and the song pane
bind -f common w win-next

# Search
bind -f common f search-start
bind -f common n search-next
bind -f common N search-prev

# Playback modes
bind -f common s toggle shuffle
bind -f common r toggle repeat
bind -f common R toggle repeat_current
bind -f common F toggle follow

# Queue and selection
bind -f common e win-add-q
bind -f common W win-toggle

# Cycle views 1-7, wrapping at either end
bind -f common J right-view
bind -f common K left-view
bind -f common tab right-view
bind -f common back_tab left-view

# Cycle sorted-library presets without typing a sort expression.
bind -f common S shell ~/.config/cmus/scripts/cycle-sort.sh

# Refresh library metadata
bind -f common U update-cache
