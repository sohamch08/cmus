# vim: set filetype=cmus :
# Alternate player title row; share the existing library and transport layout.
source ~/.config/cmus/appearance.conf

# Keep the theme's normal titleline colors, with thin Powerline separators.

# Dot-prefixed widths cap fields without padding short names into wide blocks.
set format_current=    %-.28%t%{?artist?      %-.20%a}%{?album?      %-.28%l}%=%{?date?   %y  ?  }
set altformat_current=    %F
