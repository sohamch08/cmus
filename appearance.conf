# cmus layout only. Colors stay in the selected .theme file.
# vim: set filetype=cmus :
# Icons use the terminal's Iosevka Nerd Font Mono.

# Keep the packaged cmus header minimal: plain text in the theme's colors.
set color_win_title_attr=default

# Keep navigation comfortable and the artist/album tree compact.
set scroll_offset=5
set tree_width_percent=26
set tree_width_max=40
set format_clipped_text=…

# Main library / playlist / queue: title, artist, album, then duration.
# Percentage widths adapt to the terminal width.
# Right padding lives inside the conditions so editors cannot trim it away.
set format_playlist=  %-38%t  %-22%a  %-20%l%= %{?duration?%6d  ?        }
set format_playlist_va=  %-38%t  %-22%a  %-20%l%= %{?duration?%6d  ?        }
set altformat_playlist=  %F%= %{?duration?%6d  ?        }

# Album browser: keep track numbers here, where their order is meaningful.
set format_treewin_artist=   %a
set format_treewin=     %l
set format_trackwin=  %{?tracknumber>0?%02n?  }  %t%= %{?duration?%6d  ?        }
set format_trackwin_va=  %{?tracknumber>0?%02n?  }  %-60%t%= %a  %{?duration?%6d  ?        }
set altformat_trackwin=  %F%= %{?duration?%6d  ?        }
set format_trackwin_album=   %l%= %{?date? %y    } %{?duration?%{duration}  ?  }

# One extra space compensates for the native heading inset.
# Header totals and track durations end at the same two-cell right margin.
set format_heading_artist=   %a%=  %{?duration?%{duration} ? }
set format_heading_album=   %a      %l%= %{?date? %y    } %{?duration?%{duration} ? }
set format_heading_playlist=   %{?!panel?PLAYLIST    }%{title}%=  %{?duration?%{duration} ? }

# Two-line player: track details above, transport and progress underneath.
set format_current=    %t%{?artist?      %a}%= %{?album?  }%-30%l%{?date?     %y  ?  }
set altformat_current=    %F
set format_title=cmus — %a — %t
set altformat_title=cmus — %F
set format_statusline=  %{?status=">"?󰺢 PLAYING?%{?status="|"? PAUSED? STOPPED}}  %{position}%{?duration? / %{duration}}  %= %{?shuffle="S"? TRACKS  }%{?shuffle="&"? ALBUMS  }%{?repeat_current? ONE  ?%{?repeat="R"? REPEAT  }}%{?volume>=0?%{?volume=0??%{?volume<50??}} %{volume}%%  }
set progress_bar=line
